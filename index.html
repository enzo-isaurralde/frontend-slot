<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLOT RAT</title>

  <!-- Fuentes: stencil (títulos) + monoespaciada (números) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <!-- Filtros SVG: motion blur SOLO en eje Y (feGaussianBlur "0 N") -->
  <svg width="0" height="0" aria-hidden="true">
    <defs>
      <filter id="blurY-0"><feGaussianBlur id="gy-0" stdDeviation="0 0"/></filter>
      <filter id="blurY-1"><feGaussianBlur id="gy-1" stdDeviation="0 0"/></filter>
      <filter id="blurY-2"><feGaussianBlur id="gy-2" stdDeviation="0 0"/></filter>
      <filter id="blurY-3"><feGaussianBlur id="gy-3" stdDeviation="0 0"/></filter>
      <filter id="blurY-4"><feGaussianBlur id="gy-4" stdDeviation="0 0"/></filter>
    </defs>
  </svg>

  <div id="app">
    <!-- ===== HEADER ===== -->
    <header class="hud-header">
      <h1 id="game-title">SLOT RAT</h1>
      <div class="header-actions">
        <button id="btn-sound" class="hud-btn" title="Sonido">SND ON</button>
        <button id="btn-paytable" class="hud-btn" title="Tabla de pagos">PAGOS</button>
        <button id="btn-demo" class="hud-btn" title="Modo demo">DEMO</button>
      </div>
    </header>

    <!-- ===== ESCENARIO / GRILLA ===== -->
    <main id="stage-wrap">
      <div id="stage">
        <div id="reels"></div>
        <svg id="lines-svg"></svg>
        <canvas id="fx-canvas"></canvas>
        <div id="scanlines"></div>
        <div id="bonus-overlay">
          <div id="bonus-text">OPERACIÓN NOCTURNA ACTIVADA</div>
        </div>
      </div>
    </main>

    <!-- ===== CONSOLA ===== -->
    <footer class="console">
      <div class="console-panel display">
        <span class="label">SALDO</span>
        <span id="balance-val" class="mono">10.000</span>
      </div>

      <div class="console-panel bet">
        <button id="btn-bet-minus" class="hud-btn small">−</button>
        <div class="bet-box">
          <span class="label">APUESTA</span>
          <span id="bet-val" class="mono">100</span>
        </div>
        <button id="btn-bet-plus" class="hud-btn small">+</button>
        <button id="btn-turbo" class="hud-btn">TURBO</button>
      </div>

      <button id="btn-spin">GIRAR</button>

      <div class="console-panel display">
        <span class="label">PREMIO</span>
        <span id="win-val" class="mono">0</span>
      </div>
    </footer>

    <div id="fs-badge" class="hidden">GIROS GRATIS: <span id="fs-count">0</span></div>
  </div>

  <!-- ===== MODAL: TABLA DE PAGOS ===== -->
  <div id="modal-paytable" class="modal hidden">
    <div class="modal-box">
      <h2>TABLA DE PAGOS</h2>
      <div id="paytable-body"></div>
      <p class="modal-note">3+ SCATTER en cualquier posición = 10 giros gratis (retrigger).</p>
      <button class="hud-btn modal-close" data-close="modal-paytable">CERRAR</button>
    </div>
  </div>

  <!-- ===== MODAL: MODO DEMO ===== -->
  <div id="modal-demo" class="modal hidden">
    <div class="modal-box">
      <h2>MODO DEMO</h2>
      <p class="modal-note">Forzar resultado del próximo giro:</p>
      <div class="demo-grid">
        <button class="hud-btn demo-force" data-force="bigwin">PREMIO GRANDE</button>
        <button class="hud-btn demo-force" data-force="bonus">3 SCATTERS</button>
        <button class="hud-btn demo-force" data-force="noprize">SIN PREMIO</button>
        <button class="hud-btn demo-force" data-force="">AZAR</button>
      </div>
      <button class="hud-btn modal-close" data-close="modal-demo">CERRAR</button>
    </div>
  </div>

  <!-- GSAP (única dependencia, por CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
